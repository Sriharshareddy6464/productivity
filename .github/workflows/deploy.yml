name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t productivity-frontend:latest -f Dockerfile.frontend .

      - name: Build Backend Docker Image
        run: docker build -t productivity-backend:latest -f Dockerfile.backend .

